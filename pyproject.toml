[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-jenkins"
version = "0.1.0"
description = "A sample Python application for demonstrating builds in Jenkins"
readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
test = ["build>=1.0", "pytest>=8.0"]

[project.scripts]
hello-jenkins = "hello_jenkins.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
